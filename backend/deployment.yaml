apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-backend
  namespace: hotel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hotel-backend
  template:
    metadata:
      labels:
        app: hotel-backend
    spec:
      containers:
      - name: hotel-backend
        image: chiragg619/hotel-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: MONGO_URI
          value: "mongodb://admin:YourStrongPassword123@mongodb-service.hotel.svc.cluster.local:27017/hoteldb?authSource=admin"
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "5000"
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-backend-service
  namespace: hotel
spec:
  selector:
    app: hotel-backend
  ports:
  - port: 5000
    targetPort: 5000
  type: ClusterIP
